version: "2"
type: backend
tech_stack:
  - TypeScript
  - Express.js
  - SQLite (better-sqlite3)
  - JWT authentication
  - bcrypt password hashing
features:
  - name: Authentication API
    description: JWT-based login/logout with httpOnly cookies, password change
    files:
      - server/src/routes/auth.ts
      - server/src/controllers/authController.ts
      - server/src/middleware/auth.ts
    endpoints:
      - method: POST
        path: /api/auth/login
        description: User login with username/password
        auth_required: false
        request_schema:
          body:
            username: string
            password: string
        response_schema:
          "200": "{ success: true, data: { user: { id, username, role, ... } } }"
          "401": "{ error: 'Invalid username or password' }"
      - method: POST
        path: /api/auth/logout
        description: User logout, clear token cookie
        auth_required: true
        response_schema:
          "200": "{ success: true, data: { message: 'Logged out successfully' } }"
      - method: GET
        path: /api/auth/me
        description: Get current authenticated user
        auth_required: true
        response_schema:
          "200": "{ id, username, email, role, ... }"
      - method: POST
        path: /api/auth/change-password
        description: Change current user password
        auth_required: true
        request_schema:
          body:
            currentPassword: string
            newPassword: string
        response_schema:
          "200": "{ message: 'Password changed successfully' }"
    depends_on: []

  - name: Inventory Items API
    description: CRUD operations for inventory items with stock tracking
    files:
      - server/src/routes/inventory.ts
      - server/src/controllers/inventoryController.ts
      - server/src/models/Item.ts
    endpoints:
      - method: GET
        path: /api/inventory/items
        description: List all active items with optional filters
        auth_required: true
        response_schema:
          "200": "{ success: true, data: Item[] }"
      - method: GET
        path: /api/inventory/items/:id
        description: Get item by ID with stock by warehouse
        auth_required: true
        response_schema:
          "200": "{ id, item_code, item_name, stock_by_warehouse: [...] }"
      - method: POST
        path: /api/inventory/items
        description: Create new inventory item
        auth_required: true
        request_schema:
          body:
            item_code: string (required)
            item_name: string (required)
            category: string
            unit_of_measure: string
            standard_cost: number
            standard_selling_price: number
        response_schema:
          "201": "Created item object"
          "400": "{ error: 'Item code already exists' }"
      - method: PUT
        path: /api/inventory/items/:id
        description: Update existing item
        auth_required: true
        response_schema:
          "200": "Updated item object"
      - method: DELETE
        path: /api/inventory/items/:id
        description: Soft delete item (admin only, must have 0 stock)
        auth_required: true
        admin_required: true
        response_schema:
          "200": "{ success: true, message: 'Item deleted successfully' }"
          "400": "{ error: 'Cannot delete item with existing stock' }"
      - method: GET
        path: /api/inventory/items-categories
        description: Get distinct item categories
        auth_required: true
      - method: GET
        path: /api/inventory/items-low-stock
        description: Get items below reorder level
        auth_required: true
      - method: GET
        path: /api/inventory/items-uom
        description: Get available units of measure
        auth_required: true
    depends_on:
      - Authentication

  - name: Warehouse API
    description: CRUD operations for warehouses/storage locations
    files:
      - server/src/routes/inventory.ts
      - server/src/controllers/inventoryController.ts
      - server/src/models/Warehouse.ts
    endpoints:
      - method: GET
        path: /api/inventory/warehouses
        description: List all active warehouses
        auth_required: true
      - method: GET
        path: /api/inventory/warehouses/:id
        description: Get warehouse by ID with stock summary
        auth_required: true
      - method: POST
        path: /api/inventory/warehouses
        description: Create new warehouse
        auth_required: true
        request_schema:
          body:
            warehouse_code: string (required)
            warehouse_name: string (required)
            location: string
      - method: PUT
        path: /api/inventory/warehouses/:id
        description: Update warehouse
        auth_required: true
      - method: DELETE
        path: /api/inventory/warehouses/:id
        description: Delete warehouse (admin only)
        auth_required: true
        admin_required: true
    depends_on:
      - Authentication

  - name: Stock Movements API
    description: Record and query stock movements with batch costing support
    files:
      - server/src/routes/inventory.ts
      - server/src/controllers/inventoryController.ts
      - server/src/models/StockMovement.ts
    endpoints:
      - method: GET
        path: /api/inventory/stock-movements
        description: List stock movements with filters
        auth_required: true
      - method: POST
        path: /api/inventory/stock-movements
        description: Record stock movement (PURCHASE, SALE, TRANSFER, ADJUSTMENT)
        auth_required: true
        request_schema:
          body:
            item_id: number (required)
            warehouse_id: number (required)
            quantity: number (required)
            movement_type: string (required)
            unit_cost: number
            remarks: string
      - method: GET
        path: /api/inventory/stock-summary
        description: Get stock summary across all items
        auth_required: true
      - method: GET
        path: /api/inventory/stock-ledger/:itemId
        description: Get item ledger (movement history)
        auth_required: true
      - method: GET
        path: /api/inventory/stock-balances
        description: Get current stock balances by warehouse
        auth_required: true
    depends_on:
      - Authentication
      - Inventory Items API
      - Warehouse API

  - name: Customers API
    description: CRUD operations for customers with AR ledger and statements
    files:
      - server/src/routes/customers.ts
      - server/src/controllers/customersController.ts
      - server/src/models/Customer.ts
    endpoints:
      - method: GET
        path: /api/customers
        description: List customers with pagination and search
        auth_required: true
        response_schema:
          "200": "{ success: true, data: Customer[], pagination: {...} }"
      - method: GET
        path: /api/customers/:id
        description: Get customer by ID
        auth_required: true
      - method: POST
        path: /api/customers
        description: Create new customer
        auth_required: true
        request_schema:
          body:
            customer_name: string (required)
            phone: string (required)
            email: string
            credit_limit: number
            opening_balance: number
      - method: PUT
        path: /api/customers/:id
        description: Update customer
        auth_required: true
      - method: DELETE
        path: /api/customers/:id
        description: Deactivate customer (soft delete)
        auth_required: true
      - method: GET
        path: /api/customers/:id/ledger
        description: Get customer ledger entries
        auth_required: true
      - method: GET
        path: /api/customers/:id/statement
        description: Get customer statement with date range
        auth_required: true
      - method: GET
        path: /api/customers/:id/balance
        description: Get customer current balance
        auth_required: true
    depends_on:
      - Authentication

  - name: Quotations API
    description: Create and manage sales quotations
    files:
      - server/src/routes/sales.ts
      - server/src/controllers/salesController.ts
      - server/src/models/Quotation.ts
    endpoints:
      - method: GET
        path: /api/quotations
        description: List quotations with filters
        auth_required: true
      - method: GET
        path: /api/quotations/:id
        description: Get quotation by ID with items
        auth_required: true
      - method: POST
        path: /api/quotations
        description: Create new quotation
        auth_required: true
        admin_required: true
        request_schema:
          body:
            customer_id: number (required)
            quotation_date: string (required)
            items: array (required)
      - method: PUT
        path: /api/quotations/:id
        description: Update quotation
        auth_required: true
        admin_required: true
      - method: DELETE
        path: /api/quotations/:id
        description: Delete quotation
        auth_required: true
        admin_required: true
      - method: POST
        path: /api/quotations/:id/convert
        description: Convert quotation to sales order
        auth_required: true
        admin_required: true
      - method: GET
        path: /api/quotations/:id/cycle-chain
        description: Get sales cycle chain for quotation
        auth_required: true
    depends_on:
      - Authentication
      - Customers API

  - name: Sales Orders API
    description: Create and manage sales orders
    files:
      - server/src/routes/sales.ts
      - server/src/controllers/salesController.ts
      - server/src/models/SalesOrder.ts
    endpoints:
      - method: GET
        path: /api/sales-orders
        description: List sales orders with filters
        auth_required: true
      - method: GET
        path: /api/sales-orders/:id
        description: Get sales order by ID with items
        auth_required: true
      - method: POST
        path: /api/sales-orders
        description: Create new sales order
        auth_required: true
        admin_required: true
        request_schema:
          body:
            customer_id: number (required)
            so_date: string (required)
            warehouse_id: number
            items: array (required)
      - method: PUT
        path: /api/sales-orders/:id
        description: Update sales order
        auth_required: true
        admin_required: true
      - method: DELETE
        path: /api/sales-orders/:id
        description: Delete sales order
        auth_required: true
        admin_required: true
      - method: POST
        path: /api/sales-orders/:id/convert
        description: Convert sales order to invoice
        auth_required: true
        admin_required: true
      - method: POST
        path: /api/sales-orders/:id/cancel
        description: Cancel sales order (reverses linked invoice)
        auth_required: true
        admin_required: true
      - method: GET
        path: /api/sales-orders/:id/cycle-chain
        description: Get sales cycle chain for sales order
        auth_required: true
    depends_on:
      - Authentication
      - Customers API

  - name: Invoices API
    description: Full invoice lifecycle with stock movements, payments, ledger entries
    files:
      - server/src/routes/invoices.ts
      - server/src/controllers/invoiceController.ts
      - server/src/models/Invoice.ts
    endpoints:
      - method: GET
        path: /api/invoices
        description: List invoices with filters
        auth_required: true
        response_schema:
          "200": "{ success: true, data: Invoice[] }"
      - method: GET
        path: /api/invoices/:id
        description: Get invoice by ID with items
        auth_required: true
      - method: POST
        path: /api/invoices
        description: Create new invoice with items and optional payment
        auth_required: true
        request_schema:
          body:
            customer_id: number (required)
            invoice_date: string (required)
            due_date: string
            items: array (required)
            record_payment: boolean
            payment: object
      - method: PUT
        path: /api/invoices/:id
        description: Update invoice (reverses stock, reapplies)
        auth_required: true
      - method: DELETE
        path: /api/invoices/:id
        description: Delete invoice (admin only, reverses all stock/payments/ledger)
        auth_required: true
        admin_required: true
      - method: GET
        path: /api/invoices/:id/payments
        description: Get payments for invoice
        auth_required: true
      - method: POST
        path: /api/invoices/:id/return
        description: Process return for invoice items
        auth_required: true
        admin_required: true
    depends_on:
      - Authentication
      - Customers API
      - Inventory Items API
      - Stock Movements API

  - name: Payments API
