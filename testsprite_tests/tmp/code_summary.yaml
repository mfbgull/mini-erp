    files:
      - server/src/routes/users.ts
      - server/src/controllers/userController.ts
      - server/src/models/User.ts
    endpoints:
      - method: GET
        path: /api/users
        description: List users
        auth_required: true
        admin_required: true
      - method: POST
        path: /api/users
        description: Create new user
        auth_required: true
        admin_required: true
      - method: PUT
