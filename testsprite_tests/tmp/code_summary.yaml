known_limitations:
  - issue: CSRF protection requires x-csrf-token header matching csrf-token cookie for all POST/PUT/DELETE/PATCH
    location: server/src/middleware/csrf.ts
    impact: All mutation requests need CSRF token
  - issue: Login endpoint is excluded from CSRF protection
    location: server/src/middleware/csrf.ts
    impact: Login works without CSRF token
  - issue: Admin role required for DELETE operations and quotation/sales-order creation
    location: server/src/middleware/auth.ts
    impact: Many operations require admin credentials
  - issue: JWT token is set as httpOnly cookie
    location: server/src/controllers/authController.ts
    impact: Token cannot be read by JavaScript, must use cookie-based auth
  - issue: Stock movements use FIFO batch consumption
    location: server/src/models/StockMovement.ts
    impact: Complex stock logic may have edge cases
  - issue: Invoice updates reverse and reapply stock movements
    location: server/src/controllers/invoiceController.ts
    impact: Performance impact on large invoices
