        description: List suppliers
        auth_required: true
      - method: GET
        path: /api/suppliers/:id
        description: Get supplier by ID
        auth_required: true
      - method: POST
        path: /api/suppliers
        description: Create new supplier
        auth_required: true
        request_schema:
          body:
            supplier_name: string (required)
            phone: string
            email: string
      - method: PUT
        path: /api/suppliers/:id
        description: Update supplier
        auth_required: true
      - method: DELETE
        path: /api/suppliers/:id
        description: Delete supplier
        auth_required: true
    depends_on:
      - Authentication

  - name: BOM API
    description: Bill of Materials management
    files:
      - server/src/routes/bom.ts
      - server/src/controllers/bomController.ts
      - server/src/models/BOM.ts
    endpoints:
