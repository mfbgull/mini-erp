      - server/src/controllers/purchaseOrderController.ts
      - server/src/models/PurchaseOrder.ts
    endpoints:
      - method: GET
        path: /api/purchase-orders
        description: List purchase orders
        auth_required: true
      - method: GET
        path: /api/purchase-orders/:id
        description: Get purchase order by ID
        auth_required: true
      - method: POST
        path: /api/purchase-orders
        description: Create new purchase order
        auth_required: true
        request_schema:
          body:
            supplier_id: number (required)
            po_date: string (required)
            items: array (required)
      - method: PUT
        path: /api/purchase-orders/:id
        description: Update purchase order
        auth_required: true
      - method: DELETE
        path: /api/purchase-orders/:id
        description: Delete purchase order
        auth_required: true
    depends_on:
      - Authentication
      - Suppliers API

  - name: Suppliers API
