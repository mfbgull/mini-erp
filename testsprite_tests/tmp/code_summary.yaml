        path: /api/boms
        description: List BOMs
        auth_required: true
      - method: GET
        path: /api/boms/:id
        description: Get BOM by ID with items
        auth_required: true
      - method: POST
        path: /api/boms
        description: Create new BOM
        auth_required: true
        request_schema:
          body:
            bom_name: string (required)
            finished_item_id: number (required)
            quantity: number
