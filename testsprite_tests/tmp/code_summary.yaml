      - method: GET
        path: /api/productions/:id
        description: Get production order by ID
        auth_required: true
      - method: POST
        path: /api/productions
        description: Create new production order
        auth_required: true
        request_schema:
          body:
            bom_id: number (required)
            quantity: number (required)
      - method: DELETE
        path: /api/productions/:id
        description: Delete production order (admin only)
        auth_required: true
        admin_required: true
    depends_on:
