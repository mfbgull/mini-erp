            payment_date: string (required)
            amount: number (required)
            payment_method: string
      - method: DELETE
        path: /api/payments/:id
        description: Delete payment (admin only)
        auth_required: true
        admin_required: true
    depends_on:
      - Authentication
      - Customers API

  - name: Purchase Orders API
