<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini ERP — Bioluminescent Ecosystem</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
  canvas { display: block; }

  /* HUD Overlay */
  #hud {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  #hud > * { pointer-events: auto; }

  /* Top Bar */
  #top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(0,10,20,0.9) 0%, transparent 100%);
  }
  #top-bar h1 {
    font-size: 18px; font-weight: 600;
    background: linear-gradient(90deg, #00f5d4, #00bbf9, #9b5de5);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0,245,212,0.3);
  }
  #top-bar .controls { display: flex; gap: 12px; }
  #top-bar .controls button {
    background: rgba(0,245,212,0.1); border: 1px solid rgba(0,245,212,0.3);
    color: #00f5d4; padding: 8px 16px; border-radius: 20px; cursor: pointer;
    font-size: 13px; transition: all 0.3s;
  }
  #top-bar .controls button:hover {
    background: rgba(0,245,212,0.2); border-color: #00f5d4;
    box-shadow: 0 0 15px rgba(0,245,212,0.3);
  }

  /* Info Panel */
  #info-panel {
    position: absolute; bottom: 24px; left: 24px;
    background: rgba(5,15,30,0.85); border: 1px solid rgba(0,245,212,0.2);
    border-radius: 12px; padding: 20px; max-width: 320px;
    backdrop-filter: blur(10px); transform: translateY(120%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #info-panel.visible { transform: translateY(0); }
  #info-panel h3 {
    font-size: 16px; color: #00f5d4; margin-bottom: 8px;
  }
  #info-panel p { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.5; }
  #info-panel .metric {
    display: flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  #info-panel .metric:last-child { border: none; }
  #info-panel .metric-value { color: #00bbf9; font-weight: 600; }

  /* Navigation Hint */
  #nav-hint {
    position: absolute; bottom: 24px; right: 24px;
    background: rgba(5,15,30,0.7); border: 1px solid rgba(155,93,229,0.3);
    border-radius: 12px; padding: 16px; color: rgba(255,255,255,0.6);
    font-size: 12px; line-height: 1.6; max-width: 200px;
  }
  #nav-hint kbd {
    background: rgba(155,93,229,0.2); padding: 2px 6px; border-radius: 4px;
    border: 1px solid rgba(155,93,229,0.4); color: #9b5de5;
  }

  /* Loading Screen */
  #loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, #001428 0%, #000814 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; transition: opacity 1s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading h2 {
    font-size: 24px; color: #00f5d4; margin-bottom: 20px;
    animation: pulse 2s ease-in-out infinite;
  }
  #loading .loader {
    width: 60px; height: 60px; border: 3px solid rgba(0,245,212,0.1);
    border-top-color: #00f5d4; border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Connection Status */
  #connection-status {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(5,15,30,0.8); border: 1px solid rgba(0,245,212,0.2);
    border-radius: 20px; padding: 8px 16px; font-size: 12px; color: #00f5d4;
    opacity: 0; transition: opacity 0.3s;
  }
  #connection-status.show { opacity: 1; }
  #connection-status.error { border-color: rgba(255,100,100,0.4); color: #ff6464; }
</style>
</head>
<body>

<div id="loading">
  <h2>Descending into the ERP Ecosystem...</h2>
  <div class="loader"></div>
</div>

<div id="canvas-container"></div>

<div id="hud">
  <div id="top-bar">
    <h1>🌊 Mini ERP Living Ecosystem</h1>
    <div class="controls">
      <button onclick="toggleAudio()" id="audio-btn">🔇 Audio</button>
      <button onclick="resetView()">🎯 Reset View</button>
      <button onclick="toggleColorblind()">👁 Accessibility</button>
    </div>
  </div>

  <div id="connection-status">Connecting to Mini ERP...</div>
  <div id="info-panel">
    <h3 id="info-title">Module</h3>
    <p id="info-desc">Description</p>
    <div id="info-metrics"></div>
  </div>

  <div id="nav-hint">
    <strong style="color:#9b5de5">Navigate</strong><br>
    <kbd>Mouse</kbd> Swim around<br>
    <kbd>Scroll</kbd> Zoom in/out<br>
    <kbd>Click</kbd> Explore entity<br>
    <kbd>Drag</kbd> Rotate view<br>
    <kbd>Esc</kbd> Close panel
  </div>
</div>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================
// MINI ERP BIOLUMINESCENT ECOSYSTEM
// A living, breathing representation of your ERP
// ============================================

const API_BASE = 'http://localhost:3010/api';
let erpData = null;
let audioEnabled = false;
let colorblindMode = false;

// ============================================
// THREE.JS SETUP
// ============================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000814, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 15, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ============================================
// LIGHTING
// ============================================
const ambientLight = new THREE.AmbientLight(0x001a33, 0.5);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0x4488ff, 0.3);
moonLight.position.set(10, 50, 20);
scene.add(moonLight);

// ============================================
// OCEAN WATER SURFACE (top)
// ============================================
const waterGeometry = new THREE.PlaneGeometry(200, 200, 100, 100);
const waterMaterial = new THREE.MeshPhongMaterial({
  color: 0x001a33,
  transparent: true,
  opacity: 0.3,
  shininess: 100,
  side: THREE.DoubleSide
});
const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.y = 25;
scene.add(water);

// ============================================
// SEAFLOOR
// ============================================
const floorGeometry = new THREE.PlaneGeometry(200, 200, 50, 50);
const positions = floorGeometry.attributes.position;
for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i);
  const y = positions.getY(i);
  positions.setZ(i, Math.sin(x * 0.1) * 2 + Math.cos(y * 0.15) * 1.5);
}
floorGeometry.computeVertexNormals();

const floorMaterial = new THREE.MeshPhongMaterial({
  color: 0x0a1520,
  shininess: 5,
  flatShading: true
});
const seafloor = new THREE.Mesh(floorGeometry, floorMaterial);
seafloor.rotation.x = -Math.PI / 2;
seafloor.position.y = -8;
scene.add(seafloor);

// ============================================
// BIOLUMINESCENT CORAL REEFS (Core ERP Modules)
// ============================================
const coralReefs = [];
const moduleData = [
  { name: 'Dashboard', desc: 'Central command center', color: 0x00f5d4, position: [0, -2, 0], scale: 4 },
  { name: 'Inventory', desc: 'Stock management & warehouses', color: 0x00bbf9, position: [-15, -1, -5], scale: 3.5 },
  { name: 'Sales', desc: 'Orders, invoices & POS', color: 0x9b5de5, position: [15, -1, -5], scale: 3.5 },
  { name: 'Purchases', desc: 'Purchase orders & suppliers', color: 0xf72585, position: [-15, -1, 8], scale: 3 },
  { name: 'Production', desc: 'BOM & work orders', color: 0xffbe0b, position: [15, -1, 8], scale: 3 },
  { name: 'Customers', desc: 'CRM & ledgers', color: 0x06d6a0, position: [-8, -1, -15], scale: 2.5 },
  { name: 'Reports', desc: 'Financial & analytics', color: 0x118ab2, position: [8, -1, -15], scale: 2.5 },
  { name: 'Expenses', desc: 'Cost tracking', color: 0xef476f, position: [0, -1, -18], scale: 2 },
];

function createCoralReef(data) {
  const group = new THREE.Group();
  group.position.set(...data.position);

  // Main coral structure - branching cylinders
  const coralColor = new THREE.Color(data.color);
  const baseMaterial = new THREE.MeshPhongMaterial({
    color: coralColor,
    emissive: coralColor.clone().multiplyScalar(0.3),
    transparent: true,
    opacity: 0.85,
    shininess: 80
  });

  // Central pillar
  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(data.scale * 0.3, data.scale * 0.5, data.scale * 2, 8),
    baseMaterial
  );
  pillar.position.y = data.scale * 0.5;
  group.add(pillar);

  // Branching arms
  const branchCount = Math.floor(data.scale * 2);
  for (let i = 0; i < branchCount; i++) {
    const angle = (i / branchCount) * Math.PI * 2;
    const height = data.scale * (0.5 + Math.random() * 0.5);
    const radius = data.scale * (0.5 + Math.random() * 0.5);

    const branch = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2, 0.4, height, 6),
      baseMaterial
    );
    branch.position.set(
      Math.cos(angle) * radius,
      height / 2,
      Math.sin(angle) * radius
    );
    branch.rotation.z = Math.cos(angle) * 0.4;
    branch.rotation.x = Math.sin(angle) * 0.4;
    group.add(branch);

    // Coral tips (glowing spheres)
    const tip = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 8, 8),
      new THREE.MeshPhongMaterial({
        color: coralColor,
        emissive: coralColor,
        emissiveIntensity: 0.8
      })
    );
    tip.position.set(
      Math.cos(angle) * radius + Math.cos(angle) * height * 0.2,
      height,
      Math.sin(angle) * radius + Math.sin(angle) * height * 0.2
    );
    tip.userData.isTip = true;
    tip.userData.baseAngle = angle;
    group.add(tip);
  }

  // Point light for bioluminescence
  const coralLight = new THREE.PointLight(coralColor, 1.5, data.scale * 5);
  coralLight.position.y = data.scale;
  group.add(coralLight);

  group.userData = {
    ...data,
    type: 'coral',
    light: coralLight,
    pulsePhase: Math.random() * Math.PI * 2,
    activityLevel: 0.5
  };

  return group;
}

moduleData.forEach(data => {
  const reef = createCoralReef(data);
  coralReefs.push(reef);
  scene.add(reef);
});

// ============================================
// FISH SCHOOLS (Sub-features)
// ============================================
const schools = [];
const schoolColors = [0x00f5d4, 0x00bbf9, 0x9b5de5, 0xf72585, 0xffbe0b, 0x06d6a0];

function createFishSchool(color, count, homeReef) {
  const fishGeo = new THREE.ConeGeometry(0.15, 0.6, 4);
  fishGeo.rotateX(Math.PI / 2);
  const fishMat = new THREE.MeshPhongMaterial({
    color,
    emissive: new THREE.Color(color).multiplyScalar(0.4),
    transparent: true,
    opacity: 0.8
  });

  const fish = [];
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(fishGeo, fishMat);
    mesh.position.set(
      homeReef.position.x + (Math.random() - 0.5) * 5,
      homeReef.position.y + 2 + Math.random() * 3,
      homeReef.position.z + (Math.random() - 0.5) * 5
    );
    mesh.userData = {
      velocity: new THREE.Vector3((Math.random() - 0.5) * 0.02, 0, (Math.random() - 0.5) * 0.02),
      home: homeReef.position,
      phase: Math.random() * Math.PI * 2
    };
    scene.add(mesh);
    fish.push(mesh);
  }

  return { fish, color, homeReef };
}

coralReefs.forEach((reef, i) => {
  const color = schoolColors[i % schoolColors.length];
  const school = createFishSchool(color, 12 + Math.floor(Math.random() * 8), reef);
  schools.push(school);
});

// ============================================
// PARTICLE CURRENTS (Data Flow Visualization)
// ============================================
const particleCount = 2000;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleSizes = new Float32Array(particleCount);
const particleColorsAttr = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  particlePositions[i * 3] = (Math.random() - 0.5) * 80;
  particlePositions[i * 3 + 1] = -5 + Math.random() * 20;
  particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 80;
  particleSizes[i] = Math.random() * 3 + 1;

  const c = new THREE.Color().setHSL(0.5 + Math.random() * 0.3, 0.8, 0.6);
  particleColorsAttr[i * 3] = c.r;
  particleColorsAttr[i * 3 + 1] = c.g;
  particleColorsAttr[i * 3 + 2] = c.b;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColorsAttr, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.3,
  vertexColors: true,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ============================================
// HYDROTHERMAL VENTS (Notification/Alert System)
// ============================================
const vents = [];
function createHydrothermalVent(position) {
  const group = new THREE.Group();
  group.position.set(...position);

  // Vent base
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 1, 1, 8),
    new THREE.MeshPhongMaterial({ color: 0x2a1a1a, emissive: 0x331111 })
  );
  group.add(base);

  // Bubble particles
  const bubbleGeo = new THREE.BufferGeometry();
  const bubblePos = new Float32Array(50 * 3);
  const bubbleVelocities = [];
  for (let i = 0; i < 50; i++) {
    bubblePos[i * 3] = (Math.random() - 0.5) * 0.5;
    bubblePos[i * 3 + 1] = Math.random() * 5;
    bubblePos[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
    bubbleVelocities.push(new THREE.Vector3(
      (Math.random() - 0.5) * 0.01,
      0.02 + Math.random() * 0.03,
      (Math.random() - 0.5) * 0.01
    ));
  }
  bubbleGeo.setAttribute('position', new THREE.BufferAttribute(bubblePos, 3));
  const bubbles = new THREE.Points(bubbleGeo, new THREE.PointsMaterial({
    color: 0xff6b6b,
    size: 0.2,
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending
  }));
  bubbles.userData.velocities = bubbleVelocities;
  group.add(bubbles);

  group.userData = { type: 'vent', bubbles, active: false, alertCount: 0 };
  return group;
}

const vent1 = createHydrothermalVent([-20, -7, 0]);
const vent2 = createHydrothermalVent([20, -7, 0]);
vents.push(vent1, vent2);
scene.add(vent1, vent2);

// ============================================
// PLANKTON CLOUDS (User Input Visualization)
// ============================================
const planktonClouds = [];
function createPlanktonCloud(position, color) {
  const count = 200;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = position[0] + (Math.random() - 0.5) * 4;
    pos[i * 3 + 1] = position[1] + Math.random() * 2;
    pos[i * 3 + 2] = position[2] + (Math.random() - 0.5) * 4;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color,
    size: 0.15,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending
  });
  const cloud = new THREE.Points(geo, mat);
  cloud.userData = { basePosition: position, phase: Math.random() * Math.PI * 2 };
  return cloud;
}

coralReefs.forEach(reef => {
  const color = new THREE.Color(reef.userData.color);
  const cloud = createPlanktonCloud(
    [reef.position.x, reef.position.y + 4, reef.position.z],
    color
  );
  planktonClouds.push(cloud);
  scene.add(cloud);
});

// ============================================
// ANIMATION STATE
// ============================================
let time = 0;
let targetCameraPos = new THREE.Vector3(0, 15, 40);
let targetLookAt = new THREE.Vector3(0, 0, 0);
let isMouseDragging = false;
let mouseDragStart = { x: 0, y: 0 };
let cameraAngle = 0;
let cameraHeight = 15;
let cameraDistance = 40;

// ============================================
// RAYCASTER FOR INTERACTION
// ============================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selectedReef = null;

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Check coral reef intersections
  const allMeshes = [];
  coralReefs.forEach(reef => {
    reef.traverse(child => {
      if (child.isMesh) allMeshes.push(child);
    });
  });

  const intersects = raycaster.intersectObjects(allMeshes);
  if (intersects.length > 0) {
    let parent = intersects[0].object;
    while (parent && !coralReefs.includes(parent)) {
      parent = parent.parent;
    }
    if (parent && parent.userData.type === 'coral') {
      selectReef(parent);
    }
  }
});

function selectReef(reef) {
  selectedReef = reef;
  const panel = document.getElementById('info-panel');
  document.getElementById('info-title').textContent = reef.userData.name;
  document.getElementById('info-desc').textContent = reef.userData.desc;

  const metricsDiv = document.getElementById('info-metrics');
  metricsDiv.innerHTML = '';

  // Show real data if available
  if (erpData && reef.userData.name === 'Inventory') {
    addMetric(metricsDiv, 'Total Items', erpData.totalItems || '—');
    addMetric(metricsDiv, 'Stock Value', erpData.totalStockValue ? `$${erpData.totalStockValue.toLocaleString()}` : '—');
    addMetric(metricsDiv, 'Low Stock', erpData.lowStockCount || '—');
  } else if (erpData && reef.userData.name === 'Sales') {
    addMetric(metricsDiv, 'Revenue', erpData.totalSales ? `$${erpData.totalSales.toLocaleString()}` : '—');
    addMetric(metricsDiv, 'Orders', erpData.totalOrders || '—');
  } else if (erpData && reef.userData.name === 'Dashboard') {
    addMetric(metricsDiv, 'Total Items', erpData.totalItems || '—');
    addMetric(metricsDiv, 'Stock Value', erpData.totalStockValue ? `$${erpData.totalStockValue.toLocaleString()}` : '—');
    addMetric(metricsDiv, 'Sales Revenue', erpData.totalSales ? `$${erpData.totalSales.toLocaleString()}` : '—');
    addMetric(metricsDiv, 'Production', erpData.totalProduction || '—');
  } else if (erpData && reef.userData.name === 'Customers') {
    addMetric(metricsDiv, 'Customers', erpData.totalCustomers || '—');
    addMetric(metricsDiv, 'Outstanding', erpData.totalOutstanding ? `$${erpData.totalOutstanding.toLocaleString()}` : '—');
  } else {
    // Default metrics
    addMetric(metricsDiv, 'Activity Level', `${Math.round(reef.userData.activityLevel * 100)}%`);
    addMetric(metricsDiv, 'Status', '🟢 Active');
  }

  panel.classList.add('visible');

  // Camera swoop to selected reef
  targetCameraPos.set(
    reef.position.x + 10,
    reef.position.y + 8,
    reef.position.z + 10
  );
  targetLookAt.copy(reef.position);
}

function addMetric(container, label, value) {
  const div = document.createElement('div');
  div.className = 'metric';
  div.innerHTML = `<span>${label}</span><span class="metric-value">${value}</span>`;
  container.appendChild(div);
}

// Close panel on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('info-panel').classList.remove('visible');
    selectedReef = null;
    targetCameraPos.set(0, 15, 40);
    targetLookAt.set(0, 0, 0);
  }
});

// Mouse controls
renderer.domElement.addEventListener('mousedown', (e) => {
  isMouseDragging = true;
  mouseDragStart = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('mousemove', (e) => {
  if (!isMouseDragging) return;
  const dx = e.clientX - mouseDragStart.x;
  const dy = e.clientY - mouseDragStart.y;
  cameraAngle -= dx * 0.005;
  cameraHeight = Math.max(5, Math.min(30, cameraHeight + dy * 0.1));
  mouseDragStart = { x: e.clientX, y: e.clientY };
  updateCameraTarget();
});

renderer.domElement.addEventListener('mouseup', () => { isMouseDragging = false; });

renderer.domElement.addEventListener('wheel', (e) => {
  cameraDistance = Math.max(15, Math.min(80, cameraDistance + e.deltaY * 0.05));
  updateCameraTarget();
});

function updateCameraTarget() {
  targetCameraPos.set(
    Math.sin(cameraAngle) * cameraDistance,
    cameraHeight,
    Math.cos(cameraAngle) * cameraDistance
  );
}

// ============================================
// AUDIO SYSTEM (Web Audio API)
// ============================================
let audioCtx = null;
let oceanDrone = null;
let bubbleInterval = null;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Ocean drone
  const droneOsc = audioCtx.createOscillator();
  const droneGain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  droneOsc.type = 'sine';
  droneOsc.frequency.value = 80;
  filter.type = 'lowpass';
  filter.frequency.value = 200;
  droneGain.gain.value = 0.1;

  droneOsc.connect(filter);
  filter.connect(droneGain);
  droneGain.connect(audioCtx.destination);
  droneOsc.start();

  oceanDrone = { oscillator: droneOsc, gain: droneGain };

  // Bubble sounds
  bubbleInterval = setInterval(() => {
    if (!audioEnabled) return;
    playBubble();
  }, 2000 + Math.random() * 3000);
}

function playBubble() {
  if (!audioCtx || !audioEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 800 + Math.random() * 400;
  gain.gain.value = 0.03;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  document.getElementById('audio-btn').textContent = audioEnabled ? '🔊 Audio' : '🔇 Audio';
  if (audioEnabled && !audioCtx) initAudio();
  if (oceanDrone) {
    oceanDrone.gain.gain.value = audioEnabled ? 0.1 : 0;
  }
}

// ============================================
// ACCESSIBILITY
// ============================================
function toggleColorblind() {
  colorblindMode = !colorblindMode;
  // Shift colors to high-contrast, colorblind-friendly palette
  const palette = colorblindMode
    ? [0xff0000, 0x0000ff, 0xffff00, 0x00ffff, 0xff00ff, 0xffa500, 0x00ff00, 0xffffff]
    : null;

  coralReefs.forEach((reef, i) => {
    if (palette) {
      const newColor = new THREE.Color(palette[i % palette.length]);
      reef.userData.color = palette[i % palette.length];
      reef.children.forEach(child => {
        if (child.material) {
          child.material.color.copy(newColor);
          if (child.material.emissive) child.material.emissive.copy(newColor.multiplyScalar(0.3));
        }
      });
    }
  });
}

// ============================================
// FETCH ERP DATA
// ============================================
async function fetchERPData() {
  const statusEl = document.getElementById('connection-status');
  statusEl.classList.add('show');

  try {
    // Fetch dashboard summary
    const response = await fetch(`${API_BASE}/dashboard/summary`);
    if (!response.ok) throw new Error('API not available');
    erpData = await response.json();

    statusEl.textContent = `✓ Connected to Mini ERP — ${erpData.totalItems || 0} items, $${(erpData.totalStockValue || 0).toLocaleString()} stock`;
    statusEl.classList.remove('error');

    // Update coral activity based on real data
    updateCoralActivity();

  } catch (err) {
    console.log('Running in demo mode (no API connection)');
    statusEl.textContent = '🌊 Demo Mode — No live connection';
    statusEl.classList.add('error');

    // Demo data
    erpData = {
      totalItems: 142,
      totalStockValue: 48750,
      totalSales: 12340,
      totalProduction: 28,
      totalCustomers: 67,
      totalOutstanding: 3200,
      lowStockCount: 12
    };
  }

  setTimeout(() => statusEl.classList.remove('show'), 4000);
}

function updateCoralActivity() {
  if (!erpData) return;

  // Inventory reef activity based on stock levels
  const inventoryReef = coralReefs.find(r => r.userData.name === 'Inventory');
  if (inventoryReef) {
    inventoryReef.userData.activityLevel = Math.min(1, (erpData.totalItems || 50) / 200);
  }

  // Sales reef activity based on revenue
  const salesReef = coralReefs.find(r => r.userData.name === 'Sales');
  if (salesReef) {
    salesReef.userData.activityLevel = Math.min(1, (erpData.totalSales || 1000) / 20000);
  }

  // Activate vents if low stock alerts
  const vent = vents[0];
  if (erpData.lowStockCount > 0) {
    vent.userData.active = true;
    vent.userData.alertCount = erpData.lowStockCount;
  }
}

// ============================================
// ANIMATION LOOP
// ============================================
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  // Water surface animation
  const waterPos = waterGeometry.attributes.position;
  for (let i = 0; i < waterPos.count; i++) {
    const x = waterPos.getX(i);
    const y = waterPos.getY(i);
    waterPos.setZ(i, Math.sin(x * 0.3 + time) * 0.5 + Math.cos(y * 0.2 + time * 0.8) * 0.3);
  }
  waterPos.needsUpdate = true;

  // Coral pulsing (bioluminescence)
  coralReefs.forEach(reef => {
    const pulse = Math.sin(time * 2 + reef.userData.pulsePhase) * 0.5 + 0.5;
    const activityPulse = reef.userData.activityLevel;
    const intensity = pulse * activityPulse;

    reef.userData.light.intensity = intensity * 2;

    // Pulse tips
    reef.traverse(child => {
      if (child.userData.isTip && child.material.emissive) {
        child.scale.setScalar(1 + intensity * 0.3);
      }
    });

    // Gentle sway
    reef.rotation.z = Math.sin(time * 0.5 + reef.userData.pulsePhase) * 0.02;
  });

  // Fish school movement
  schools.forEach(school => {
    school.fish.forEach(fish => {
      const home = fish.userData.home;
      const t = time + fish.userData.phase;

      // Swim in circular pattern around home reef
      fish.position.x = home.x + Math.sin(t * 0.5) * 4 + Math.sin(t * 0.3) * 2;
      fish.position.y = home.y + 3 + Math.sin(t * 0.8) * 1;
      fish.position.z = home.z + Math.cos(t * 0.5) * 4 + Math.cos(t * 0.3) * 2;

      // Face direction of movement
      fish.rotation.y = Math.atan2(
        Math.cos(t * 0.5) * 2 + Math.cos(t * 0.3) * 1,
        -Math.sin(t * 0.5) * 2 - Math.sin(t * 0.3) * 1
      );
    });
  });

  // Particle current drift
  const posAttr = particleGeo.attributes.position;
  for (let i = 0; i < particleCount; i++) {
    let x = posAttr.getX(i);
    let y = posAttr.getY(i);
    let z = posAttr.getZ(i);

    x += Math.sin(time * 0.5 + z * 0.1) * 0.02;
    y += Math.sin(time * 0.3 + x * 0.05) * 0.01;
    z += 0.03;

    // Wrap around
    if (z > 40) z = -40;
    if (x > 40) x = -40;
    if (x < -40) x = 40;
    if (y > 15) y = -5;
    if (y < -5) y = 15;

    posAttr.setXYZ(i, x, y, z);
  }
  posAttr.needsUpdate = true;

  // Hydrothermal vent bubbles
  vents.forEach(vent => {
    if (vent.userData.active) {
      const bubblePos = vent.userData.bubbles.geometry.attributes.position;
      const vels = vent.userData.bubbles.userData.velocities;
      for (let i = 0; i < 50; i++) {
        let y = bubblePos.getY(i);
        y += vels[i].y;
        if (y > 8) {
          y = 0;
          bubblePos.setX(i, (Math.random() - 0.5) * 0.5);
          bubblePos.setZ(i, (Math.random() - 0.5) * 0.5);
        }
        bubblePos.setY(i, y);
      }
      bubblePos.needsUpdate = true;
    }
  });

  // Plankton cloud drift
  planktonClouds.forEach(cloud => {
    const pos = cloud.geometry.attributes.position;
    const phase = cloud.userData.phase;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      pos.setY(i, pos.getY(i) + Math.sin(time + phase + i * 0.1) * 0.005);
      pos.setX(i, x + Math.cos(time * 0.5 + phase) * 0.002);
    }
    pos.needsUpdate = true;
  });

  // Camera smooth follow
  camera.position.lerp(targetCameraPos, 0.02);
  const currentLookAt = new THREE.Vector3();
  camera.getWorldDirection(currentLookAt);
  camera.lookAt(targetLookAt);

  renderer.render(scene, camera);
}

// ============================================
// WINDOW RESIZE
// ============================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================
// RESET VIEW
// ============================================
function resetView() {
  cameraAngle = 0;
  cameraHeight = 15;
  cameraDistance = 40;
  updateCameraTarget();
  targetLookAt.set(0, 0, 0);
  document.getElementById('info-panel').classList.remove('visible');
  selectedReef = null;
}

// ============================================
// INITIALIZE
// ============================================
window.addEventListener('load', () => {
  fetchERPData();
  animate();

  // Hide loading screen
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 2000);

  // Refresh data periodically
  setInterval(fetchERPData, 30000);
});
</script>
